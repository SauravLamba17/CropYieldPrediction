# "Field & Harvest" theme for the Crop Yield dashboard. Colours come from ui/theme.py
# (TOKENS); tests/test_theme.py fails if the two drift apart.
# Fonts are bundled in static/fonts/ (OFL-1.1), so the app looks the same offline.

[server]
enableStaticServing = true            # serves static/ (the bundled fonts)
# No code-change watcher: it re-scanned every imported module on each new browser session
# (about 5 s per page load). Restart the app after editing code.
fileWatcherType = "none"

[client]
toolbarMode = "viewer"                # keeps the menu with the Light / Dark / System switch
showSidebarNavigation = false

[theme]
base = "light"
font = "Inter"
headingFont = "Manrope"
codeFont = "IBM Plex Mono"
baseFontSize = 15
headingFontSizes = ["26px", "20px", "16px", "15px", "14px", "14px"]
headingFontWeights = [800, 700, 700, 600, 600, 600]
baseRadius = "10px"
buttonRadius = "999px"
showWidgetBorder = true
linkUnderline = false

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-400-normal.woff2"
weight = 400

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-500-normal.woff2"
weight = 500

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-600-normal.woff2"
weight = 600

[[theme.fontFaces]]
